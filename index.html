<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>공부하기</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#ffffff;--fg:#0b0d10;--muted:#2f353c;--line:#c3cad1;--head:#eef0f2;--accent:#8a2c0d;--link:#0a4f9c;--card:#f7f8f9}
html.dark{--bg:#111316;--fg:#ffffff;--muted:#d6dce2;--line:#4a525c;--head:#23282f;--accent:#ffb27a;--link:#8cc8ff;--card:#1a1e23}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:500 16px/1.7 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
header h1{margin:0;font-size:18px;font-weight:800}
#q,#pw{width:100%;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:16px}
main{padding:12px 16px 40px;max-width:900px;margin:0 auto}
h2.g{font-size:15px;margin:22px 0 8px;color:var(--accent);font-weight:800}
.item,.btn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:11px 13px;margin:7px 0;font:inherit;font-weight:700;cursor:pointer}
.btn{text-align:center;background:var(--accent);color:#fff;border:none}
.item small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:2px}
#doc{display:none}
#doc h1{font-size:22px;border-bottom:2px solid var(--accent);padding-bottom:6px;font-weight:800}
#doc h2{font-size:19px;margin-top:30px;border-bottom:1px solid var(--line);padding-bottom:4px;font-weight:800}
#doc h3{font-size:17px;margin-top:22px;color:var(--accent);font-weight:800}
#doc strong,#doc th{font-weight:800}
#doc a{color:var(--link)}
#doc table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto;margin:10px 0}
#doc th,#doc td{border:1px solid var(--line);padding:5px 8px;vertical-align:top;text-align:left}
#doc th{background:var(--head);white-space:nowrap}
#doc code{background:var(--head);padding:1px 4px;border-radius:4px;font-size:90%}
#doc blockquote{margin:10px 0;padding:4px 12px;border-left:4px solid var(--accent)}
#doc ul,#doc ol{padding-left:22px}
details.toc{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:10px 0;background:var(--card)}
details.toc summary{font-weight:800;cursor:pointer}
details.toc ul{list-style:none;padding-left:12px;margin:4px 0}
.tr{font-size:15px}.ts{display:inline-block;min-width:48px;color:var(--accent);font-weight:800}
.msg{padding:24px 0;text-align:center;color:var(--muted)}
#back{display:none;border:none;background:none;color:var(--link);font:inherit;font-weight:800;padding:0;margin-right:8px;cursor:pointer}
#lock{display:none}
.foot{margin-top:30px;text-align:center}
.foot button{border:none;background:none;color:var(--muted);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<header><h1><button id="back">‹ 목록</button><span id="ttl">📚 공부하기</span></h1><input id="q" placeholder="문서 제목 검색" style="display:none"></header>
<main>
  <div id="lock">
    <p class="msg">문서가 암호화되어 있습니다.<br>봇이 알려 드린 <b>미니앱 비밀번호</b>를 한 번만 넣어 주세요.<br>이 기기의 텔레그램에 기억됩니다.</p>
    <input id="pw" type="password" autocomplete="off" placeholder="비밀번호">
    <button class="btn" id="unlock">열기</button>
    <div class="msg" id="lockmsg"></div>
  </div>
  <div id="list"><div class="msg">불러오는 중…</div></div>
  <article id="doc"></article>
  <div class="foot" id="foot" style="display:none"><button id="forget">이 기기에서 비밀번호 지우기</button></div>
</main>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); if (tg.colorScheme === 'dark') document.documentElement.classList.add('dark'); }
const $ = s => document.querySelector(s);
const REV = new URLSearchParams(location.search).get('v') || Date.now();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let KEY = null, groups = [];

// 비밀번호 저장: 텔레그램 CloudStorage(기기 간 동기) → 안 되면 localStorage
const store = {
  get: () => new Promise(res => {
    try { if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'))
      return tg.CloudStorage.getItem('np_pass', (e, v) => res(e ? null : (v || null))); } catch (e) {}
    try { res(localStorage.getItem('np_pass')); } catch (e) { res(null); }
  }),
  set: v => { try { if (tg && tg.CloudStorage && tg.isVersionAtLeast('6.9')) tg.CloudStorage.setItem('np_pass', v); } catch (e) {}
              try { localStorage.setItem('np_pass', v); } catch (e) {} },
  del: () => { try { if (tg && tg.CloudStorage && tg.isVersionAtLeast('6.9')) tg.CloudStorage.removeItem('np_pass'); } catch (e) {}
               try { localStorage.removeItem('np_pass'); } catch (e) {} },
};
async function derive(pass) {
  const meta = await (await fetch('data/meta.json?v=' + REV, {cache: 'no-store'})).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(meta.salt), iterations: meta.iter, hash: 'SHA-256'},
                                 base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
}
async function openEnc(path) {
  const j = await (await fetch(path + '?v=' + REV, {cache: 'no-store'})).json();
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(j.iv)}, KEY, b64(j.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(pass, remember) {
  KEY = await derive(pass);
  const m = await openEnc('data/m.enc');   // 비밀번호가 틀리면 여기서 예외
  groups = m.groups; if (remember) store.set(pass);
  $('#lock').style.display = 'none'; $('#q').style.display = 'block'; $('#foot').style.display = 'block';
  drawList();
}
function showLock(msg) {
  $('#list').innerHTML = ''; $('#lock').style.display = 'block'; $('#lockmsg').textContent = msg || '';
}
function drawList(q = '') {
  const el = $('#list'); el.innerHTML = '';
  for (const g of groups) {
    const items = g.items.filter(i => !q || i.title.toLowerCase().includes(q.toLowerCase()));
    if (!items.length) continue;
    const h = document.createElement('h2'); h.className = 'g'; h.textContent = g.group + ` (${items.length})`; el.appendChild(h);
    for (const i of items) {
      const b = document.createElement('button'); b.className = 'item'; b.textContent = i.title;
      const s = document.createElement('small'); s.textContent = '수정 ' + i.sub; b.appendChild(s);
      b.onclick = () => openDoc(i.id); el.appendChild(b);
    }
  }
}
async function openDoc(id) {
  const d = $('#doc'); $('#list').style.display = 'none'; $('#q').style.display = 'none'; $('#foot').style.display = 'none';
  d.style.display = 'block'; d.innerHTML = '<div class="msg">불러오는 중…</div>'; window.scrollTo(0, 0);
  $('#back').style.display = 'inline'; if (tg) tg.BackButton.show();
  try {
    const j = await openEnc('data/' + id + '.enc');
    $('#ttl').textContent = j.title.slice(0, 24);
    d.innerHTML = (j.toc && j.toc.includes('<li') ? '<details class="toc"><summary>목차</summary>' + j.toc + '</details>' : '') + j.html;
  } catch (e) { d.innerHTML = '<div class="msg">문서를 열지 못했습니다. 목록으로 돌아가 다시 시도해 주세요.</div>'; }
}
function back() { $('#doc').style.display = 'none'; $('#list').style.display = 'block'; $('#q').style.display = 'block';
  $('#foot').style.display = 'block'; $('#back').style.display = 'none'; $('#ttl').textContent = '📚 공부하기'; if (tg) tg.BackButton.hide(); }
$('#back').onclick = back; if (tg) tg.BackButton.onClick(back);
$('#q').oninput = e => drawList(e.target.value);
$('#unlock').onclick = async () => {
  $('#lockmsg').textContent = '여는 중…';
  try { await unlock($('#pw').value.trim(), true); } catch (e) { KEY = null; $('#lockmsg').textContent = '비밀번호가 맞지 않습니다.'; }
};
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#unlock').click(); });
$('#forget').onclick = () => { store.del(); location.reload(); };
(async () => {
  const saved = await store.get();
  if (!saved) return showLock();
  try { await unlock(saved, false); } catch (e) { store.del(); showLock('저장된 비밀번호가 바뀌었습니다. 새 비밀번호를 넣어 주세요.'); }
})();
</script>
</body>
</html>
